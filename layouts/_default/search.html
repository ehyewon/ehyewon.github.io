{{ define "main" }}
<section class="py-8">
  <div class="container mx-auto px-4">
    <h1 class="text-2xl font-bold mb-6">검색 결과</h1>
    <div id="search-results" class="space-y-6">
      <p>검색 중입니다...</p>
    </div>
  </div>
</section>

<script>
  window.addEventListener("DOMContentLoaded", function() {
    const resultsContainer = document.getElementById("search-results");
    const query = new URLSearchParams(window.location.search).get("q");
    if (!query) return;

    fetch("/js/wowchemy-search.js")
      .then(res => res.text())
      .then(text => {
        const matches = text.match(new RegExp(query, "gi"));
        if (!matches) {
          resultsContainer.innerHTML = `<p>‘${query}’에 대한 결과가 없습니다.</p>`;
        } else {
          resultsContainer.innerHTML = `<p>‘${query}’ 관련 결과 ${matches.length}건이 있습니다.</p>`;
        }
      })
      .catch(() => {
        resultsContainer.innerHTML = `<p>검색 데이터를 불러오지 못했습니다.</p>`;
      });
  });
</script>
{{ end }}
